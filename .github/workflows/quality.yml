name: quality

on:
  pull_request:
  push:
    branches: [main, jubeex-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      # The application has pre-existing repository-wide lint/type debt. Keep
      # this workflow deterministic and blocking for the deployment machinery
      # instead of producing a permanently red, non-actionable status check.
      - run: >-
          uv run ruff format --check
          scripts/render_ecs_task_for_environment.py
          tests/test_render_ecs_task_for_environment.py
      - run: >-
          uv run ruff check
          scripts/render_ecs_task_for_environment.py
          tests/test_render_ecs_task_for_environment.py
      - run: uv run pytest -q tests/test_render_ecs_task_for_environment.py
      - run: uv run python -m compileall -q src
