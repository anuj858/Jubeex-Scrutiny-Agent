[project]
name = "jubeex-llamaindex-test"
version = "0.1.0"
description = "Indian court legal-document parsing microservice using LlamaIndex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-cloud>=2.4.1,<3",
    "json-schema-to-pydantic>=0.4.8",
    "llama-index-workflows>=2.16.0,<3.0.0",
    "python-dotenv>=1.1.0",
    "jsonref>=1.1.0",
    "click>=8.2.1,<8.3.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.0",
    "pinecone>=7.0.0,<8",
]

[dependency-groups]
dev = [
    "ruff>=0.11.10",
    "typescript>=0.0.12",
    "ty>=0.0.2",
    "pytest>=8.4.1",
    "hatch>=1.14.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.1",
    "llama-cloud-fake>=0.1,<0.2",
    "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_review"]

# Ship the defect catalogue inside the wheel so the deployed agent can load it
# without depending on the repo layout.
[tool.hatch.build.targets.wheel.force-include]
"scrutiny_harness/rules" = "extraction_review/_rules"

[tool.hatch.envs.default.scripts]
"format" = "ruff format ."
"format-check" = "ruff format --check ."
"lint" = "ruff check --fix ."
"lint-check" = ["ruff check ."]
typecheck = "ty check src"
test = "pytest"
"all-check" = ["format-check", "lint-check", "test"]
"all-fix" = ["format", "lint", "test"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"

[tool.llamadeploy]
env_files = [".env"]
llama_cloud = true
required_env_vars = ["PINECONE_API_KEY", "OPENROUTER_API_KEY"]

# Optional runtime defaults. .env overrides these. Do not put secrets here.
[tool.llamadeploy.env]
VECTOR_BACKEND = "pinecone"
PINECONE_INDEX = "legal-document-knowledge"
PINECONE_CLOUD = "aws"
PINECONE_REGION = "us-east-1"
PINECONE_EMBED_MODEL = "llama-text-embed-v2"
PINECONE_TEXT_FIELD = "normalized_text"
PINECONE_NAMESPACE = "jubeex-filings"
OPENROUTER_MODEL = "openai/gpt-5.5"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_TIMEOUT_S = "180"
OPENROUTER_APP_TITLE = "JubeeX Scrutiny"
SCRUTINY_ENABLED = "true"
SCRUTINY_DEFECTS = "D001,D002,D003,D004,D005,D006"
SCRUTINY_CONCURRENCY = "3"
SCRUTINY_TOP_K = "8"
SCRUTINY_MAX_CHUNKS = "24"

[tool.llamadeploy.workflows]
process-file = "extraction_review.process_file:workflow"
metadata = "extraction_review.metadata_workflow:workflow"
scrutiny-check = "extraction_review.scrutiny_workflow:workflow"

[tool.llamadeploy.ui]
directory = "ui"

