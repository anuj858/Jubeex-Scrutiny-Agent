[project]
name = "jubeex-llamaindex-test"
version = "0.1.0"
description = "Indian court legal-document parsing microservice using LlamaIndex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-cloud>=2.19.0,<3.0.0",
    "json-schema-to-pydantic>=0.4.8",
    "llama-index-workflows>=2.26.1,<3.0.0",
    "python-dotenv>=1.1.0",
    "jsonref>=1.1.0",
    "click>=8.2.1,<8.3.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "llama-index-core>=0.14.25,<0.15.0",
    "pinecone>=7.0.0,<8",
    "pypdf>=5.0.0,<7",
    "pymupdf>=1.24,<2",
    "pillow>=11,<13",
    "boto3>=1.35,<2.0",
    "awscrt>=0.23,<1.0",
    "botocore[crt]>=1.43.89",
    "psycopg[binary]>=3.2,<4",
    "google-auth>=2.35,<3",
    "google-genai>=2.30.1,<3",
    "xlsxwriter>=3.2.9,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.11.10",
    "typescript>=0.0.12",
    "ty>=0.0.2",
    "pytest>=8.4.1",
    "hatch>=1.14.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.1",
    "llama-cloud-fake>=0.1.1,<0.2",
    "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
jubeex-api = "extraction_review.api:main"
jubeex-sqs-worker = "extraction_review.worker:main"
jubeex-batch-qa = "extraction_review.batch_qa.cli:main"
jubeex-validate-pinecone = "extraction_review.pinecone_validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_review"]

# Ship the defect catalogue inside the wheel so the deployed agent can load it
# without depending on the repo layout.
[tool.hatch.build.targets.wheel.force-include]
"scrutiny_harness/rules" = "extraction_review/_rules"
"src/extraction_review/visual/references" = "extraction_review/visual/references"

[tool.hatch.envs.default.scripts]
"format" = "ruff format ."
"format-check" = "ruff format --check ."
"lint" = "ruff check --fix ."
"lint-check" = ["ruff check ."]
typecheck = "ty check src"
test = "pytest"
"all-check" = ["format-check", "lint-check", "test"]
"all-fix" = ["format", "lint", "test"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"

[tool.llamadeploy]
env_files = [".env"]
llama_cloud = true
required_env_vars = [
    "PINECONE_API_KEY",
    "CATALOGUE_DATABASE_URL",
]

# Optional runtime defaults. .env overrides these. Do not put secrets here.
[tool.llamadeploy.env]
SPLIT_RECONCILIATION_MODE = "targeted"
SPLIT_OUTPUT_DOCUMENTS = "All"
VECTOR_BACKEND = "pinecone"
PINECONE_INDEX = "legal-document-knowledge"
PINECONE_CLOUD = "aws"
PINECONE_REGION = "us-east-1"
PINECONE_EMBED_MODEL = "llama-text-embed-v2"
PINECONE_TEXT_FIELD = "normalized_text"
PINECONE_NAMESPACE = "jubeex-filings"
LLM_PROVIDER = "vertex"
GOOGLE_CLOUD_PROJECT = "scrutiny-jubeex"
GOOGLE_CLOUD_LOCATION = "global"
VERTEX_MODEL = "gemini-4-argon"
OPENROUTER_MODEL = "google/gemini-4-argon"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_TIMEOUT_S = "180"
OPENROUTER_APP_TITLE = "JubeeX Scrutiny"
OPENROUTER_VISION_ENABLED = "true"
OPENROUTER_VISION_MODEL = "google/gemini-4-argon"
SCRUTINY_MODEL = "gemini-4-argon"
VISION_PREVIEW_DPI = "160"
VISION_CONCURRENCY = "4"
VISION_RENDER_CONCURRENCY = "1"
VISION_REQUEST_TIMEOUT_S = "120"
SCRUTINY_ENABLED = "true"
SCRUTINY_CATALOGUE_SOURCE = "db"
SCRUTINY_DEFECTS = "all"
SCRUTINY_CONCURRENCY = "8"
VERTEX_REQUESTS_PER_MINUTE = "8"
VERTEX_MAX_ATTEMPTS = "6"
VERTEX_REQUEST_TIMEOUT_S = "900"
JUBEEX_SQS_VISIBILITY_TIMEOUT = "600"
JUBEEX_SQS_HEARTBEAT_SECONDS = "60"
SCRUTINY_TOP_K = "8"
SCRUTINY_MAX_CHUNKS = "12"
SCRUTINY_RERANK_ENABLED = "true"
PINECONE_RERANK_MODEL = "bge-reranker-v2-m3"
SCRUTINY_RERANK_MAX_CANDIDATES = "60"
PINECONE_RERANK_CONCURRENCY = "4"
AWS_S3_BUCKET = "jubeex-893338224943-ap-south-1-an"
AWS_REGION = "ap-south-1"

[tool.llamadeploy.workflows]
process-file = "extraction_review.process_file:workflow"
process-split-files = "extraction_review.process_split_files:workflow"
metadata = "extraction_review.metadata_workflow:workflow"
scrutiny-check = "extraction_review.scrutiny_workflow:workflow"

[tool.llamadeploy.ui]
directory = "ui"
package_manager = "npm"
